[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "minillm"
version = "0.2.0"
description = "A small single-GPU inference engine with a custom SmolLM2 runner and Responses API"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "huggingface-hub>=1.27.0",
    "jinja2>=3.1.6",
    "numpy>=2.5.2",
    "openai>=3.23.0",
    "pillow>=12.3.0",
    "regex>=2026.7.19",
    "safetensors>=0.8.0",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "transformers>=5.15.0",
    "uvicorn>=0.53.0",
]

[tool.setuptools.packages.find]
include = ["minillm*"]

[tool.setuptools.package-data]
minillm = ["static/*.html"]
